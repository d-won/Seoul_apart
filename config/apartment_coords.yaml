# 아파트별 좌표 사전 (거리 분석용)
# ------------------------------------------------------------------------------
# 국토부 실거래가에는 위경도가 없어, 여기에 아파트 좌표를 등록해 두면 거리 분석에
# 사용합니다. key = (lawd_cd, apt_name) 조합. apt_name 은 실거래 데이터의
# 아파트명(aptNm)과 '정확히' 일치해야 매칭됩니다.
#
# 채우는 방법:
#   - 소수의 관심 단지는 아래처럼 수동 등록(카카오맵 등에서 좌표 확인)
#   - 대량 자동화는 geocode.py(선택) 로 지오코딩 API 호출
#
# 아래는 형식 예시용 소수 표본입니다(좌표는 추정치). 실제 분석 전 관심 단지를
# 추가/검증하세요. apt_name 은 반드시 실거래 데이터 표기와 동일해야 합니다.
# ------------------------------------------------------------------------------
apartments:
