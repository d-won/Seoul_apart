# 서울 주요 재개발·재건축 구역 (2015~2025)
# ------------------------------------------------------------------------------
# 이 파일은 분석의 기준점(재개발 구역)을 정의합니다. 직접 수정/확장하세요.
#
# 각 이벤트 시점(events)은 'YYYY-MM' 형식. 사용 가능한 이벤트 키:
#   designation        : 정비구역지정 / 조합설립
#   management_disposal : 관리처분인가  (← 이벤트 스터디 기본 기준. 재개발 실현 확정 신호)
#   construction        : 착공 / 철거 개시
#   occupancy           : 준공 / 입주
#
# 좌표(lat/lon)는 구역 중심 '추정치'(오차 수백 m 가능). 정밀 분석 시 지오코딩으로 보정하세요.
# 세대수/날짜의 신뢰도는 note 에 (확실/추정/불확실)로 표기했습니다.
# 출처: 국토부 실거래가, 나무위키/위키백과, 언론 보도. 확정 전 정비사업 정보몽땅
#       (cleanup.seoul.go.kr) 교차검증 권장.
#
# ⚠ LAWD_CD는 '자치구' 단위라 한 구에 여러 구역이 섞입니다(예: 강동구=둔촌+고덕,
#   동작구=흑석+노량진). 분석 시 법정동(dong)+아파트명으로 2차 구분이 필요합니다.
# ------------------------------------------------------------------------------

